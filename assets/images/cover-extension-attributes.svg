<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#1b2a44"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g opacity="0.08" fill="#4493f8">
    <circle cx="1400" cy="150" r="260"/>
    <circle cx="180" cy="820" r="200"/>
  </g>
  <!-- Terminal window -->
  <g transform="translate(260 170)">
    <rect width="1080" height="560" rx="22" fill="#161b22" stroke="#30363d" stroke-width="3"/>
    <rect width="1080" height="64" rx="22" fill="#21262d"/>
    <rect y="40" width="1080" height="24" fill="#21262d"/>
    <circle cx="44" cy="32" r="11" fill="#ff5f57"/>
    <circle cx="80" cy="32" r="11" fill="#febc2e"/>
    <circle cx="116" cy="32" r="11" fill="#28c840"/>
    <g font-family="Menlo, monospace" font-size="34">
      <text x="56" y="150" fill="#7ee787">#!/bin/zsh</text>
      <text x="56" y="215" fill="#8b949e"># Jamf Pro extension attribute</text>
      <text x="56" y="295" fill="#ff7b72">if <tspan fill="#c9d1d9">[[ -d </tspan><tspan fill="#a5d6ff">"$app"</tspan><tspan fill="#c9d1d9"> ]]; </tspan>then</text>
      <text x="110" y="360" fill="#c9d1d9">echo <tspan fill="#a5d6ff">"&lt;result&gt;Installed&lt;/result&gt;"</tspan></text>
      <text x="56" y="425" fill="#ff7b72">fi</text>
      <rect x="56" y="462" width="20" height="40" fill="#4493f8"/>
    </g>
  </g>
</svg>
